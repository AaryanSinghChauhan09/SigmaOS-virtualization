[package]
name = "sigmaos-virtualization"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Virtualization and VM support"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-virtualization"
readme = "README.md"
keywords = ["virtualization", "vm", "qemu"]
categories = ["virtualization"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
